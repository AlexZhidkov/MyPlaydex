<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      MyPlaydex — Greater Perth Amateur &amp; Casual Sports Discovery
    </title>
    <meta
      name="description"
      content="Discover casual sports games, weekly social kickabouts, and club sessions across Greater Perth without accounts or apps."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myplaydex.com.au/" />
    <meta property="og:title" content="MyPlaydex — Greater Perth Amateur Sports Discovery" />
    <meta property="og:description" content="Find social soccer, volleyball, basketball, AFL, tennis, pickleball, and run clubs near you in Greater Perth." />
    <meta property="og:image" content="https://myplaydex.com.au/og-card.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyPlaydex — Greater Perth Amateur Sports Discovery" />
    <meta name="twitter:description" content="Find social soccer, volleyball, basketball, AFL, tennis, pickleball, and run clubs near you in Greater Perth." />
    <meta name="twitter:image" content="https://myplaydex.com.au/og-card.png" />
    <meta name="twitter:url" content="https://myplaydex.com.au/" />

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- Top Sticky Navigation Header -->
    <header class="app-header">
      <div class="header-container">
        <a href="/" class="brand">
          <span class="brand-name">MyPlaydex</span>
          <span class="brand-badge">Perth</span>
        </a>

        <div class="header-actions">
          <a
            href="mailto:azhidkov@gmail.com?subject=%5BMyPlaydex%5D%20Suggest%20an%20Activity%20%2F%20Club&amp;body=Hi%20Alex%2C%0A%0AI%20would%20like%20to%20suggest%20a%20new%20sports%20activity%20or%20club%20for%20MyPlaydex%3A%0A%0AClub%20%2F%20Organizer%20Name%3A%20%0ASport%20%2F%20Activity%3A%20%0AVenue%20Name%20%26%20Address%20%2F%20Suburb%3A%20%0ASchedule%20%2F%20Day%20%26%20Time%3A%20%0ACost%20%2F%20Free%3A%20%0AWebsite%20or%20Referral%20Link%3A%20%0AAdditional%20Notes%3A%20%0A"
            class="suggest-header-link"
            id="suggest-header-btn"
            aria-label="Suggest an Activity"
            title="Suggest an activity or club"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="suggest-header-icon" aria-hidden="true">➕</span>
            <span class="suggest-btn-text">Suggest an Activity</span>
          </a>
          <button
            type="button"
            class="filter-header-btn"
            id="filter-header-btn"
            aria-label="Filter sports"
            title="Filter by sport category"
          >
            <span class="filter-header-icon" aria-hidden="true">⚡</span>
            <span class="filter-btn-text">Filters</span>
            <span class="filter-count-badge hidden" id="filter-count-badge"
              >0</span
            >
          </button>
          <button
            type="button"
            class="location-switcher-btn"
            id="location-switcher-btn"
            aria-label="Change current location"
          >
            <span aria-hidden="true">📍</span>
            <span id="current-location-label" class="location-name-text"
              >Set Location</span
            >
            <span class="caret-icon" aria-hidden="true">▾</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Feed & Controls -->
    <main class="main-layout">
      <!-- Top-Level 3-Tab Discovery Switcher -->
      <section class="discovery-tabs-section" aria-label="Discovery lists">
        <div
          id="discovery-tabs"
          class="discovery-tabs"
          role="tablist"
          focusgroup="tablist nomemory"
          aria-label="Discovery categories"
        >
          <button
            type="button"
            id="tab-activities"
            class="discovery-tab active"
            data-tab="activities"
            role="tab"
            aria-selected="true"
            focusgroupstart
          >
            Activities
          </button>
          <button
            type="button"
            id="tab-organizers"
            class="discovery-tab"
            data-tab="organizers"
            role="tab"
            aria-selected="false"
          >
            Organizers
          </button>
          <button
            type="button"
            id="tab-venues"
            class="discovery-tab"
            data-tab="venues"
            role="tab"
            aria-selected="false"
          >
            Venues
          </button>
        </div>
      </section>

      <!-- Proximity Radius Selector Bar -->
      <section class="radius-bar-section" aria-label="Proximity Radius">
        <div
          class="radius-pill-group"
          role="radiogroup"
          aria-label="Distance filter radius"
        >
          <button
            type="button"
            class="radius-pill"
            data-radius="5"
            role="radio"
            aria-checked="false"
          >
            5 km
          </button>
          <button
            type="button"
            class="radius-pill active"
            data-radius="10"
            role="radio"
            aria-checked="true"
          >
            10 km
          </button>
          <button
            type="button"
            class="radius-pill"
            data-radius="25"
            role="radio"
            aria-checked="false"
          >
            25 km
          </button>
          <button
            type="button"
            class="radius-pill"
            data-radius="all"
            role="radio"
            aria-checked="false"
          >
            All
          </button>
        </div>
      </section>

      <!-- Feed Meta & Loading State -->
      <div class="feed-meta-row">
        <span id="loading-label" class="loading-label"
          >Loading activities...</span
        >
      </div>

      <!-- Reactive Discovery Feed Container -->
      <section
        id="feed-container"
        class="feed-container"
        role="tabpanel"
        aria-labelledby="tab-activities"
        aria-live="polite"
      >
        <!-- Activity, Organizer, or Venue cards or empty state render here -->
      </section>
    </main>

    <!-- Cold-Start Location Gate & Switcher Overlay -->
    <div
      id="location-gate-overlay"
      class="location-gate-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gate-title"
    >
      <div class="location-gate-card">
        <button
          type="button"
          id="gate-close-btn"
          class="gate-close-btn"
          aria-label="Close location selector"
          style="display: none"
        >
          &times;
        </button>

        <div class="gate-hero-icon" aria-hidden="true">📍</div>
        <h2 id="gate-title" class="gate-title">Find Social Sports Near You</h2>
        <p class="gate-subtitle">
          Explore casual social sports, club training sessions, and weekend
          kickabouts across Greater Perth.
        </p>

        <div class="gate-actions">
          <button
            type="button"
            class="btn btn-primary btn-gps"
            data-action="use-gps"
          >
            📍 Use My Current Location
          </button>
        </div>

        <div class="gate-divider">
          <span>or choose your suburb</span>
        </div>

        <div class="suburb-search-box">
          <label for="suburb-search-input" class="visually-hidden"
            >Search Greater Perth Suburb or Postcode</label
          >
          <div class="input-with-icon">
            <span class="search-icon" aria-hidden="true">🔎</span>
            <input
              type="text"
              id="suburb-search-input"
              name="suburb-search"
              placeholder="Search suburb or postcode (e.g. Scarborough, 6000)..."
              autocomplete="off"
            />
          </div>
          <div
            id="suburb-suggestions-list"
            class="suburb-suggestions-list"
            role="listbox"
          ></div>
        </div>

        <div class="gate-quick-presets">
          <span class="presets-label">Popular suburbs:</span>
          <div class="preset-chips">
            <button type="button" class="chip-preset" data-suburb="Perth">
              Perth CBD
            </button>
            <button type="button" class="chip-preset" data-suburb="Scarborough">
              Scarborough
            </button>
            <button type="button" class="chip-preset" data-suburb="Fremantle">
              Fremantle
            </button>
            <button type="button" class="chip-preset" data-suburb="Joondalup">
              Joondalup
            </button>
            <button type="button" class="chip-preset" data-suburb="Cottesloe">
              Cottesloe
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dedicated Multi-Category Sport Filter View Overlay (/#filters) -->
    <div id="filter-view-overlay" class="filter-view-overlay hidden"></div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
