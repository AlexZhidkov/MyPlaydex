<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Sign-In | MyPlaydex</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }
      .login-card {
        width: min(90vw, 380px);
        padding: 2rem;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .login-title {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .login-status {
        margin: 0;
        font-size: 0.95rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1 class="login-title">MyPlaydex Admin</h1>
      <p id="login-status" class="login-status" role="status" aria-live="polite">
        Signing in with Google...
      </p>
    </main>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
