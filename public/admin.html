<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Workspace | MyPlaydex</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
      }
      .admin-shell {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem;
      }
      .admin-status {
        margin: 2rem auto;
        max-width: 420px;
        padding: 1.5rem;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        text-align: center;
        font-size: 0.95rem;
        color: #475569;
      }
      .admin-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }
      .admin-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .admin-account {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .admin-email {
        font-size: 0.9rem;
        color: #475569;
      }
      .sign-out-btn {
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      .sign-out-btn:hover:not(:disabled) {
        background: #f1f5f9;
      }
      .sign-out-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .curation-placeholder {
        margin-top: 1.5rem;
        min-height: 240px;
        border-radius: 12px;
        border: 1px dashed #cbd5e1;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <p id="admin-status" class="admin-status" role="status" aria-live="polite">
        Verifying admin session...
      </p>

      <section id="admin-workspace" hidden>
        <header class="admin-header">
          <h1 class="admin-title">MyPlaydex Admin</h1>
          <div class="admin-account">
            <span id="admin-email" class="admin-email"></span>
            <button id="sign-out-btn" type="button" class="sign-out-btn">Sign out</button>
          </div>
        </header>
        <section id="curation-placeholder" class="curation-placeholder" aria-label="Listing curation"></section>
      </section>
    </main>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
