<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Workspace | MyPlaydex</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <p id="admin-status" class="admin-status" role="status" aria-live="polite">
        Verifying admin session...
      </p>

      <section id="admin-workspace" hidden>
        <header class="admin-header">
          <h1 class="admin-title">MyPlaydex Admin</h1>
          <div class="admin-account">
            <span id="admin-email" class="admin-email"></span>
            <button id="sign-out-btn" type="button" class="sign-out-btn">Sign out</button>
          </div>
        </header>
        <section id="admin-curation" class="admin-curation" aria-label="Listing curation"></section>
        <dialog id="admin-delete-dialog" class="admin-dialog" aria-labelledby="delete-dialog-title"></dialog>
      </section>
    </main>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
